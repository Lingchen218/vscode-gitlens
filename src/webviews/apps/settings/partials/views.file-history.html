<section id="file-history-view" class="section--settings section--collapsible" tabindex="-1">
	<div class="section__header">
		<h2>
			文件历史视图
			<a
				class="link__learn-more"
				title="了解更多"
				href="https://help.gitkraken.com/gitlens/side-bar/#file-history-view"
			>
				<i class="icon icon__info"></i>
			</a>
		</h2>

		<p class="section__header-hint">
			添加一个
			<a
				class="command command--show-view"
				title="在侧边栏中显示视图"
				href="command:gitlens.showFileHistoryView"
				>文件历史视图</a
			>
			来可视化、导航和探索当前文件、指定文件或文件夹的修订历史，或仅当前文件的选定行
		</p>
	</div>

	<div class="section__collapsible">
		<div class="section__group">
			<div class="section__content">
				<div class="settings settings--fixed ml-1">
					<div class="setting">
						<div class="setting__input">
							<input
								id="views.fileHistory.avatars"
								name="views.fileHistory.avatars"
								type="checkbox"
								data-setting
							/>
							<label for="views.fileHistory.avatars">使用作者头像</label>
						</div>
					</div>

					<div class="setting">
						<div class="setting__input">
							<label class="non-interactive">仅在显示文件夹历史时适用：</label>
						</div>
					</div>

					<div class="settings ml-2">
						<div class="section__group">
							<div class="section__content">
								<div class="settings settings--fixed">
									<div class="setting">
										<div class="setting__input">
											<input
												id="views.fileHistory.pullRequests.enabled"
												name="views.fileHistory.pullRequests.enabled"
												type="checkbox"
												data-setting
											/>
											<label for="views.fileHistory.pullRequests.enabled"
												>显示关联的拉取请求</label
											>
										</div>
										<p class="setting__hint">
											需要连接到支持的远程服务（例如 GitHub）
										</p>
									</div>

									<div class="settings settings--fixed ml-2">
										<div class="setting" data-enablement="views.fileHistory.pullRequests.enabled">
											<div class="setting__input">
												<input
													id="views.fileHistory.pullRequests.showForCommits"
													name="views.fileHistory.pullRequests.showForCommits"
													type="checkbox"
													data-setting
													disabled
												/>
												<label for="views.fileHistory.pullRequests.showForCommits"
													>显示引入每个提交的拉取请求</label
												>
											</div>
										</div>
									</div>
								</div>
							</div>
						</div>

						<div class="setting">
							<div class="setting__input">
								<label for="views.fileHistory.files.layout">文件布局</label>
								<div class="select-container">
									<select
										id="views.fileHistory.files.layout"
										name="views.fileHistory.files.layout"
										data-setting
									>
										<option value="auto">自动</option>
										<option value="list">列表</option>
										<option value="tree">树形</option>
									</select>
								</div>
							</div>
							<p class="setting__hint" data-visibility="views.fileHistory.files.layout =auto">
								根据每个嵌套级别的文件数量选择最佳布局
							</p>
						</div>

						<div class="setting">
							<div class="setting__input">
								<label for="views.fileHistory.files.icon">文件图标</label>
								<div class="select-container">
									<select
										id="views.fileHistory.files.icon"
										name="views.fileHistory.files.icon"
										data-setting
									>
										<option value="type">显示文件类型（默认）</option>
										<option value="status">显示文件状态</option>
									</select>
								</div>
							</div>
						</div>

						<div class="setting">
							<div class="setting__input">
								<input
									id="views.fileHistory.files.compact"
									name="views.fileHistory.files.compact"
									type="checkbox"
									data-setting
								/>
								<label for="views.fileHistory.files.compact">使用紧凑文件布局</label>
							</div>
							<p class="setting__hint">
								在使用树形布局时压缩（扁平化）不必要的嵌套
							</p>
						</div>
					</div>
				</div>
			</div>

			<div class="section__preview">
				<img
					class="image__preview"
					src="#{webroot}/media/file-history-view.webp"
					loading="lazy"
					width="600"
					height="360"
				/>
				<img
					class="image__preview--overlay hidden"
					src="#{webroot}/media/file-history-view-avatars.webp"
					data-visibility="views.fileHistory.avatars"
					loading="lazy"
					width="600"
					height="360"
				/>
			</div>
		</div>

		<div class="section__group">
			<p class="section__hint">
				<i class="icon icon__info"></i> 更多选项，请打开
				<a
					class="secondary"
					title="打开设置界面"
					href="command:workbench.action.openSettings?%22gitlens.views.fileHistory%22"
					>设置界面</a
				>
				并搜索 <b><i>gitlens.views.fileHistory</i></b> 或
				<b><i>gitlens.views</i></b>
			</p>
		</div>
	</div>
</section>
